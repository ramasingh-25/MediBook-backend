databases:
  - name: medibook-db
    databaseName: medibook
    user: medibook_user
    plan: free

services:
  - type: web
    name: medibook-auth
    env: docker
    dockerContext: ./MediBook.AuthService/MediBook.AuthService
    dockerfilePath: ./MediBook.AuthService/MediBook.AuthService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: medibook-db
          property: connectionString

  - type: web
    name: medibook-appointment
    env: docker
    dockerContext: ./MediBook.AppointmentService
    dockerfilePath: ./MediBook.AppointmentService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: medibook-db
          property: connectionString

  - type: web
    name: medibook-provider
    env: docker
    dockerContext: ./MediBook.ProviderService
    dockerfilePath: ./MediBook.ProviderService/Dockerfile
    plan: free
