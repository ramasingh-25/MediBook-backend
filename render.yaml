  - type: web
    name: medibook-payment
    env: docker
    dockerContext: ./MediBook.PaymentService
    dockerfilePath: ./MediBook.PaymentService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: medibook-db
          property: connectionString

  - type: web
    name: medibook-record
    env: docker
    dockerContext: ./MediBook.RecordService
    dockerfilePath: ./MediBook.RecordService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: medibook-db
